name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - '_reviewers/**'
      - '_verification/**'
      - '_includes/**'
      - '_layouts/**'
      - 'assets/**'
      - 'tests/**'
      - '*.html'
      - '*.json'
      - '*.txt'
      - '_config.yml'
      - 'Gemfile'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install test dependencies
        run: pip install pyyaml

      # Every reviewer and verification technique is validated before Jekyll runs.
      - name: Test entry front matter
        run: python -m unittest discover -s tests -t .

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build

      - name: Strip links that Pages will not publish
        run: |
          find ./_site -type l -exec rm -v {} +

      - name: Add .nojekyll file
        run: touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: ./_site

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || '' }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
