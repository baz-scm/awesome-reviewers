name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - '_reviewers/**'
      - '_data/**'
      - '_includes/**'
      - '_layouts/**'
      - 'assets/**'
      - '*.html'
      - '*.py'
      - '_config.yml'
      - 'Gemfile'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # The corpus is the only source of truth, so it has to stay in the shape
      # the site expects: discussions in sibling JSON files, no raw Liquid in
      # instruction bodies.
      - name: Validate reviewer migrations
        run: |
          python migrate_json.py
          if [[ -n "$(git status --porcelain _reviewers)" ]]; then
            echo "::error::Reviewer markdown files need JSON migration. Run 'python migrate_json.py' locally and commit the results."
            git status --short _reviewers
            exit 1
          fi

      - name: Validate Liquid escaping
        run: |
          python escape_liquid.py
          if [[ -n "$(git status --porcelain _reviewers)" ]]; then
            echo "::error::Reviewer markdown files contain unescaped Liquid syntax. Run 'python escape_liquid.py' locally and commit the results."
            git status --short _reviewers
            exit 1
          fi

      # Domain stats, dates, indexes, raw endpoints, bundles and llms.txt are all
      # derived from _reviewers/ and are not committed.
      - name: Build derived data
        run: python build_data.py

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build

      - name: Strip links that Pages will not publish
        run: |
          find ./_site -type l -exec rm -v {} +
          find ./_site -type f -links +1 || true

      - name: Add .nojekyll file
        run: touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: ./_site

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || '' }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
