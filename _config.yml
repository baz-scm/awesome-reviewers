# Site settings
title: "Awesome Reviewers"
description: "Review and verification techniques for code, from production repositories. Browse reviewer instructions and verification techniques in one place."
baseurl: ""
url: "https://awesomereviewers.com"
repository: "baz-scm/awesome-reviewers"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty
excerpt_separator: ""
sass:
  style: compressed

# Collections: the two first-party entry types, one page each.
collections:
  reviewers:
    output: true
    permalink: /reviewers/:name/
  verification:
    output: true
    permalink: /verification/:name/

plugins:
  - jekyll-sitemap

# _reviewers/<slug>.json holds the discussions each instruction was derived from.
# It is source data, not site content, so it is not published.
exclude:
  - Gemfile
  - Gemfile.lock
  - CLAUDE.md
  - README.md
  - LICENSE
  - tests/
  - node_modules
  - vendor/
  - _reviewers/*.json

defaults:
  - scope:
      path: "_reviewers"
    values:
      layout: "reviewer"
      render_with_liquid: false
  - scope:
      path: "_verification"
    values:
      layout: "technique"

# No theme: the layouts and stylesheet are local.
theme: null
