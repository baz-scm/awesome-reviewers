# Site settings
title: "Awesome Reviewers"
description: "Expert engineering instructions for AI and infrastructure domains, distilled from code review discussions in production repositories."
baseurl: ""
url: "https://awesomereviewers.com"
repository: "baz-scm/awesome-reviewers"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty
excerpt_separator: ""
sass:
  style: compressed

# Collections
collections:
  reviewers:
    output: true
    permalink: /reviewers/:name/

# Plugins
plugins:
  - jekyll-sitemap

# The discussion JSON files sitting next to each instruction are static files of
# the `reviewers` collection, so Jekyll already copies them to /<slug>.json —
# which is where an instruction page fetches its source discussions from. Do not
# also `include: _reviewers`: that copies all 157 MB of them a second time.

exclude:
  - Gemfile
  - Gemfile.lock
  - CLAUDE.md
  - README.md
  - build_data.py
  - escape_liquid.py
  - migrate_json.py
  - node_modules
  - vendor/
  # awesome-harness is a separate tool that consumes the corpus; none of it is site
  # content. Excluded rather than left to Jekyll's defaults because its markdown
  # would otherwise be rendered as pages, and a full build already renders 5k+.
  # (`.harness/`, the per-repository state, is skipped anyway as a dotted directory.)
  - harness/
  - .harness/

# Default front matter
defaults:
  - scope:
      path: "_reviewers"
    values:
      render_with_liquid: false
  - scope:
      path: ""
      type: "reviewers"
    values:
      layout: "reviewer"
