{% assign e = include.entry %}
<li class="row" data-slug="{{ e.slug }}" data-topic="{{ e.topic | escape }}" data-language="{{ e.language | escape }}" data-repository="{{ e.repository | escape }}" data-updated="{{ e.updated }}" data-comments="{{ e.comments }}">
  <div class="row__head">
    <div>
      <button class="row__toggle" data-toggle aria-expanded="false"><span class="row__title">{{ e.title }}</span><span class="row__desc">{{ e.description | truncate: 140 }}</span></button>
      <div class="row__meta">
        <a href="https://github.com/{{ e.repository }}" rel="noopener">{{ e.repository }}</a>
        <span class="chip">{{ e.topic }}</span>
        <span class="chip">{{ e.language }}</span>
        {% unless include.hide_domain %}<a href="{{ '/domains/' | append: e.domain | append: '/' | relative_url }}">{{ e.domain }}</a>{% endunless %}
        <time data-date="{{ e.updated }}">{{ e.updated }}</time>
      </div>
    </div>
    <div class="row__actions">
      <button class="btn" data-copy="{{ e.slug }}">copy</button>
      <a class="btn" href="{{ '/raw/' | append: e.slug | append: '.md' | relative_url }}">raw</a>
      <a class="btn" href="{{ '/reviewers/' | append: e.slug | append: '/' | relative_url }}">open</a>
    </div>
  </div>
  <div class="row__body" data-body hidden></div>
</li>
