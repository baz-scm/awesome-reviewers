<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title and page.url != "/" %}{{ page.title | escape }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ site.url }}{{ page.url }}">
  <link rel="icon" type="image/png" href="{{ '/favicon.png' | relative_url }}">
  <link rel="manifest" href="{{ '/manifest.json' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">

  <meta property="og:title" content="{% if page.title and page.url != '/' %}{{ page.title | escape }} · {% endif %}{{ site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <meta property="og:image" content="{{ site.url }}/assets/images/ar-web.png">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="topbar">
  <div class="wrap topbar__inner">
    <a class="brand" href="{{ '/' | relative_url }}">Awesome Reviewers</a>
    <nav class="topnav" aria-label="Site">
      <a href="https://github.com/{{ site.repository }}" rel="noopener">GitHub</a>
    </nav>
  </div>
</header>

<main id="main">
{{ content }}
</main>

<footer class="footer">
  <div class="wrap">
    <p>
      Distilled from code review discussions and CI checks in production open-source repositories.
      <a href="https://github.com/{{ site.repository }}/blob/main/LICENSE" rel="noopener">Apache-2.0</a>
      · Maintained by <a href="https://baz.co" rel="noopener">Baz</a>
    </p>
  </div>
</footer>

<script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
